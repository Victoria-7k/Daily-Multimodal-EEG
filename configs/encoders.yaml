encoders:
  eeg:
    name: baseline_placeholder
    output_dim: 256
  ppg:
    name: statistics_mlp_placeholder
    output_dim: 128
  gsr:
    name: statistics_mlp_placeholder
    output_dim: 128
  acc:
    name: statistics_mlp_placeholder
    output_dim: 128
  video:
    name: openface_pooling_placeholder
    output_dim: 256
  audio:
    name: wav2vec2_pooling_placeholder
    output_dim: 768

profiles:
  basic:
    eeg: basic_smoke_metadata_v1
    wear: basic_wear_statistics_v1
    face: basic_smoke_metadata_v1
    audio: basic_smoke_metadata_v1
  real_v1:
    eeg: eeg_real_frozen_v1
    wear: wear_sequence_v1
    face: openface_temporal_v1
    audio: wavlm_frozen_v1

audio_real_profiles:
  wavlm_frozen_v1:
    output_dim: 256
    target_sample_rate_hz: 16000
    pooling: mean
    checkpoint_required: true
  wav2vec2_frozen_v1:
    output_dim: 256
    target_sample_rate_hz: 16000
    pooling: mean
    checkpoint_required: true
  audio_opensmile_egemaps_v1:
    backend: opensmile_egemaps
    feature_set: eGeMAPSv02
    feature_level: Functionals
    output_dim: 256
    checkpoint_required: false
  audio_emotion2vec_plus_v1:
    backend: emotion2vec
    checkpoint_required: true
    output_dim: 256
    pooling: mean_std_max
    checkpoint_path: outputs/checkpoints/emotion2vec_plus_large

eeg_real_profiles:
  eeg_bandpower_v1:
    output_dim: 256
    target_sample_rate_hz: 250
    target_window_samples: 2500
    notch_hz: 50
    bandpass_hz: [1, 45]
    checkpoint_required: false
  eeg_deep_frozen_v1:
    backend: braindecode_eegpt
    checkpoint_repo: braindecode/eegpt-pretrained
    checkpoint_path: outputs/checkpoints/eegpt-pretrained
    output_dim: 256
    target_sample_rate_hz: 250
    target_window_samples: 2500
    frozen_feature_dim: 2048
    checkpoint_required: true

face_real_profiles:
  face_raw_openface_stats_v1:
    output_dim: 256
    source: raw_video
    extractor: openface
    low_confidence_threshold: 0.80
    min_success_rate: 0.50
    preprocessing_enabled: false
  face_preprocessed_openface_stats_v1:
    output_dim: 256
    source: preprocessed_face_crop
    extractor: openface
    low_confidence_threshold: 0.80
    min_success_rate: 0.50
    preprocessing_enabled: true
    activation_rule: face_preprocessing_decision
  openface_only_v1:
    output_dim: 256
    source: openface_csv
    extractor: openface
    contract_key: face_emb
    min_success_rate: 0.50
  openface_behavior_flags_v2:
    output_dim: 256
    source: openface_csv_plus_behavior_flags
    contract_key: face_emb
    behavior_flag_count: 8
    projection: deterministic_fixed_random
  fullframe_deep_v4:
    output_dim: 256
    source: full_window_video
    contract_key: face_emb
    frame_count: 8
    pooling: mean_std
  openface_deep_behavior_v3:
    output_dim: 256
    source: openface_csv_plus_fullframe_deep
    contract_key: face_emb
    optional_behavior_flags: true

wear_real_profiles:
  wear_sequence_v1:
    output_dim: 256
    encoder: deterministic_sequence_projection
    target_sample_rates_hz:
      ppg: 64
      gsr: 32
      acc: 32
    raw_sequence_cache: true
    statistics_cache: true
    checkpoint_required: false
  wear_deep_sequence_v1:
    output_dim: 256
    encoder: patchtst_or_ts2vec_frozen
    target_sample_rates_hz:
      ppg: 64
      gsr: 32
      acc: 32
    checkpoint_required: true
  wear_physio_features_v2:
    output_dim: 256
    encoder: deterministic_physio_feature_projection
    ppg_features: [heart_rate, ibi_mean, ibi_std, rmssd, peak_count, missing_ratio]
    gsr_features: [tonic_mean, phasic_std, scr_count, slope, missing_ratio]
    acc_features: [motion_intensity, stationary_ratio, axis_std, spectral_energy]

fair_embedding_ablation:
  aligned_variants:
    basic_aligned:
      source: basic_embeddings
      note: Same sample rows as the real pack.
    basic_no_path:
      source: basic_embeddings
      path_neutral_modalities: [eeg, face, audio]
      preserved_modalities: [wear]
    path_only:
      source: sample_id_subject_session_source_paths
      signal_arrays: false
    real:
      source: real_embeddings
  decision_rule: "A real branch must beat basic_no_path and remain competitive with basic_aligned on identical sample_id rows."
